<div id="modal-back" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<!--
  Mock mode: open this file with ?mock=1 (works straight off the filesystem).
  document.write keeps the script order deterministic without a bundler; the
  mock installs window.HubMock, and app.js picks it up if present.
-->
<script>
(function () {
  try {
    if (/[?&]mock=1(?:&|$)/.test(window.location.search)) {
      document.write('<script src="mock/api.js"><\/script>');
    }
  } catch (e) { /* nothing we can do this early */ }
})();
</script>
<script src="app.js"></script>

</body>
