<!--
  Mock mode: open this page with ?mock=1 and the whole panel runs against
  mock/api.js, which fakes fetch() and WebSocket rather than the API, so the
  real rpc.js / api.js / app.js code paths (methods, paths, CSRF header, the
  /ws handshake) are the ones being exercised. ?mock=1&fleet=40 makes it a
  forty-instance fleet.

  document.write keeps the script order deterministic without a bundler.
-->
<script>
(function () {
  try {
    if (/[?&]mock=1(?:&|$)/.test(window.location.search)) {
      document.write('<script src="mock/api.js"><\/script>');
    }
  } catch (e) { /* nothing we can do this early */ }
})();
</script>
<script src="rpc.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>

</body>
