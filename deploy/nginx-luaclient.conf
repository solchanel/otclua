# =============================================================================
# /etc/nginx/sites-available/luaclient
#
# TLS termination in front of the luaclient hub, which speaks plain HTTP on
# 127.0.0.1:8777 and has no TLS of its own.
#
#   cp /opt/luaclient/deploy/nginx-luaclient.conf /etc/nginx/sites-available/luaclient
#   # edit server_name (two places) and the upstream port if you changed it
#   ln -s ../sites-available/luaclient /etc/nginx/sites-enabled/luaclient
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d panel.example.com --agree-tos -m you@example.com --redirect
#
# certbot rewrites the ssl_certificate lines and adds the :80 redirect itself;
# the placeholder snapshot below is what it replaces.  Then, in
# /etc/luaclient/hub.conf:
#
#   HUB_EXTRA_ARGS="--csrf-strict --trusted-proxy=127.0.0.1/32"
#   systemctl restart luaclient-hub
#
# -----------------------------------------------------------------------------
# THE HOST HEADER IS PINNED, AND THAT SHAPES THIS FILE.
#
# hub/server.lua answers only to a Host it recognises: for a loopback bind that
# is 127.0.0.1, localhost and [::1], and --allowed-host does NOT extend that list
# for a loopback bind (see hub/server.lua's allowedHostsFor()).  It also demands
# that Origin, when present, be same-origin with Host -- PORT INCLUDED.  A
# browser on https://panel.example.com sends Origin: https://panel.example.com,
# so passing the real Host through would be refused by the Host pin, and passing
# a loopback Host with the real Origin would be refused as cross-origin.
#
# So this config rewrites BOTH to the hub's own origin.  What that costs, stated
# honestly: the hub's Origin check becomes a comparison of two values nginx
# wrote, and stops being one of the four independent CSRF checks.  The other
# three still do the work, and against a real cross-site attacker they are
# enough:
#   * the session cookie is SameSite=Strict, so a request from evil.com carries
#     no session at all and is simply unauthenticated;
#   * Sec-Fetch-Site arrives from the browser and is passed through untouched --
#     a cross-site POST reads `cross-site` and is refused;
#   * X-CSRF-Token can only be produced by having READ a same-origin response,
#     and --csrf-strict makes it mandatory.  Set it.  It is the check that
#     survives this rewrite intact.
# DNS rebinding is likewise answered here rather than in the hub: nginx serves
# this vhost only for the server_name below, and the default_server catch-all at
# the bottom closes the door on every other name that resolves to this address.
# =============================================================================

# WebSocket upgrade: pass Connection: upgrade through only when the client asked
# for it, and Connection: close otherwise.  A blanket `Connection: upgrade` on
# ordinary requests breaks keepalive to the upstream.
#
# Note when you test this with curl: over HTTP/2 an Upgrade: websocket request is
# a protocol error and answers 400, because HTTP/2 has no Upgrade mechanism (RFC
# 8441's extended CONNECT is a different thing and nginx does not advertise it).
# That is not a misconfiguration.  A browser notices the same absence and opens a
# separate HTTP/1.1 connection for GET /ws, which is the path this map serves.
# To reproduce it by hand, add --http1.1:
#   curl -k --http1.1 -i -b jar -H 'Origin: https://panel.example.com' \
#        -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
#        -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: AAAAAAAAAAAAAAAAAAAAAA==' \
#        https://panel.example.com/ws        ->  HTTP/1.1 101 Switching Protocols
map $http_upgrade $luaclient_connection {
    default upgrade;
    ''      close;
}

# Two rate-limit zones.  The general one is generous: the panel is a live
# dashboard and a single operator makes bursts of API calls.  The login one is
# tight, and it is in front of the expensive path -- one PBKDF2 verification is
# ~270 ms of uninterruptible work in a single-threaded hub, so a burst of login
# attempts is a denial of service against telemetry and the bot ticks even when
# every password is wrong.  The hub has its own account and address limiters and
# its own serialising queue; this is the cheap outer layer that keeps the flood
# off the reactor entirely.
limit_req_zone  $binary_remote_addr  zone=luaclient_api:10m    rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=luaclient_login:10m  rate=12r/m;
limit_conn_zone $binary_remote_addr  zone=luaclient_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # certbot replaces this block with its own redirect + the ACME location.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    # certbot --nginx rewrites these four lines.
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:luaclient_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------------------------------------------------------- security headers
    # HSTS: only turn this on once TLS actually works for this name -- it is
    # sticky in every browser that sees it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # The panel is vanilla JS with no CDN and no build step, but it does use
    # inline <style>/<script> in index.html, hence 'unsafe-inline'.  connect-src
    # must allow wss: for GET /ws.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # An uploaded bot script is capped at 512 KiB by the hub (413 past it);
    # give nginx a little headroom so the hub's own error is what the operator
    # sees rather than nginx's.
    client_max_body_size 1m;
    client_body_timeout  30s;

    limit_conn luaclient_conn 24;

    access_log /var/log/nginx/luaclient.access.log;
    error_log  /var/log/nginx/luaclient.error.log;

    # ------------------------------------------------------------- the upstream
    location / {
        limit_req zone=luaclient_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8777;

        # Read the block at the top of this file before changing these two.
        proxy_set_header Host   127.0.0.1:8777;
        proxy_set_header Origin http://127.0.0.1:8777;

        # Sec-Fetch-Site is a browser header the hub checks; nginx forwards
        # unknown request headers unchanged, so nothing is needed for it here.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $luaclient_connection;

        proxy_buffering off;          # the panel streams status at 1 Hz
        proxy_read_timeout  3600s;    # GET /ws is a long-lived socket
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;
    }

    # The sign-in path, and only it: a much tighter bucket in front of the
    # hub's PBKDF2.  `burst=5` lets an operator fumble a password without
    # meeting a 503, `nodelay` makes the refusal immediate rather than queued.
    location = /api/session {
        limit_req zone=luaclient_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8777;
        proxy_set_header Host   127.0.0.1:8777;
        proxy_set_header Origin http://127.0.0.1:8777;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Same for the one-time bootstrap.
    location = /api/bootstrap {
        limit_req zone=luaclient_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8777;
        proxy_set_header Host   127.0.0.1:8777;
        proxy_set_header Origin http://127.0.0.1:8777;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# Every other name that resolves to this machine gets nothing.  Without this,
# nginx serves the first server block for an unmatched Host, which would put the
# panel behind a name you never chose.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    return 444;
}
